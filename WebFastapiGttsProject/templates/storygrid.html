{% extends "layout.html" %}
{% block content %}

<div class="container">
    <div class="jumbotron">
        <h1>🎛️ STORY MAKER</h1>
    </div>

    <div class="action-bar" style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center;">
        <button id="loadStoryGridDataBtn" class="btn btn-primary load-sentence" disabled>Load Sentences</button>
        <button id="createStoryBtn" class="btn btn-primary load-sentence">New Story</button>
        <!-- Industry Practice: Keep bulk actions outside the table and disabled until selection happens -->
        <button id="chapterSelectedBtn" class="btn btn-danger" style="display: none;">🗑️ Delete Selected (<span id="selectedCount">0</span>)</button>
    </div>

    <table class="table">
        <thead>
            <tr>
                <!-- Master Checkbox to Select All -->
                <th style="width: 40px; text-align: center;">
                    <input type="checkbox" id="selectAllCheckbox" aria-label="Select all rows">
                </th>
                <th>ID</th>
                <th>Serial No</th>
                <th>Sentence Text</th>
                <th>Master Audio (.mp3)</th>
                <th>Duration</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            <tr>
                <td colspan="7" style="text-align: center; color: #666;">
                    Click "Load Sentences" to populate grid.
                </td>
            </tr>
        </tbody>
    </table>

    <div class="pagination-wrapper" style="margin: 20px 0; display: flex; justify-content: center; align-items: center; gap: 15px; font-family: sans-serif;">
        <button id="prevPageBtn" class="btn btn-secondary" style="padding: 6px 12px; cursor: pointer;" disabled>
            ⏮️ Previous
        </button>
        <span id="pageInfo" style="font-weight: 600; color: #444; font-size: 14px;">
            Page 1
        </span>
        <button id="nextPageBtn" class="btn btn-secondary" style="padding: 6px 12px; cursor: pointer;" disabled>
            Next ⏭️
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/storygrid.js" defer></script>
{% endblock %}
