{% extends "layout.html" %}
{% block content %}

    <!-- Fullscreen Background Canvas -->
    <div id="canvas-container">
        <div id="slide1" class="bg-slide"></div>
        <div id="slide2" class="bg-slide"></div>

        <!-- Configuration Panel (Setup Paths) - INSIDE fullscreen container -->
        <div id="config-panel" class="floating-panel">
            <div class="panel-header" id="config-header">
                <span>⚙️ Path Configuration</span>
            </div>

            <div class="panel-body">
                <div>
                    <label>Absolute Image Folder Path:</label>
                    <input type="text" id="img-path-input" placeholder="e.g., C:/Users/Name/Pictures or /home/pics">
                </div>
                <div>
                    <label>Absolute MP3 Folder Path:</label>
                    <input type="text" id="mp3-path-input" placeholder="e.g., C:/Music or /home/music">
                </div>
                <button class="save-btn" onclick="savePaths()">Apply Media Sources</button>
            </div>
        </div>

        <!-- Music Player Window Overlay - INSIDE fullscreen container -->
        <div id="floating-player" class="floating-panel">
            <div class="panel-header" id="player-header">
                <span>🎵 Music Player</span>
                <button class="close-btn" onclick="togglePlayer(false)">X</button>
            </div>
            <div class="panel-body">
                <div class="player-controls">
                    <button id="play-btn" class="player-btn" onclick="playAudio()" title="Play">▶ Play</button>
                    <button id="pause-btn" class="player-btn" onclick="pauseAudio()" title="Pause">⏸ Pause</button>
                    <button id="stop-btn" class="player-btn" onclick="stopAudio()" title="Stop">⏹ Stop</button>
                </div>
                <div class="playlist-info">
                    <small id="current-track-info">No track loaded</small>
                </div>
                <audio id="audio-element" controls></audio>
            </div>
        </div>

        <!-- Fullscreen Close Button (only visible in fullscreen) -->
        <button id="exit-fullscreen-btn" class="exit-fullscreen-btn" style="display: none;" title="Exit Fullscreen (ESC)">
            Exit Fullscreen ✕
        </button>
    </div>

    <div id="hud-hint">Press <strong>"M"</strong> to toggle panels | <strong>"F"</strong> for fullscreen.</div>


{% endblock %}

{% block scripts %}
<script src="/static/wavesurfer.min.js"></script>
<script src="/static/regions.min.js"></script>
<script src="/static/js/slideshow.js"></script>
{% endblock %}
