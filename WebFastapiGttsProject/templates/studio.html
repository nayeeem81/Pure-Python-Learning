{% extends "layout.html" %}

{% block content %}

<div class="container">
    <div class="jumbotron">
        <h1>🎙 Audio Studio</h1>
    </div>
    <div class="row">
        <div class="col-md-12">
            <!-- SECTION 1: GENERATE NEW TEXT-TO-SPEECH -->
            <div class="card">
                <h3>Live Text-to-Speech (gTTS)</h3>
                <input class="tts-text" type="text" id="ttsText" value="Hello! This text is transformed into speech by FastAPI.">
                <button onclick="handleLiveTTS()">Speak Now</button>
            </div>
           
            <!-- UNIFIED GLOBAL PLAYER LAYER -->
            <div class="card">
                <h3>🎵 Master Audio Player</h3>
                <audio id="masterPlayer" controls style="width: 100%;"></audio>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/wavesurfer.min.js"></script>
<script src="/static/regions.min.js"></script>
<!-- 💡 IMPORTANT: Ensure this matches the exact file name you chose for your consolidated JS script -->
<script src="/static/js/studio-engine.js" defer></script>
{% endblock %}
