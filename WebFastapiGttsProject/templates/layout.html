<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "Dashboard" }} - FastAPI Web App</title>
    <!-- Points to static/content/ folder -->
    <link rel="stylesheet" type="text/css" href="/static/content/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="/static/content/site.css" />
    <!-- Points to static/scripts/ folder -->
    <script src="/static/scripts/modernizr-2.6.2.js"></script>
</head>
<body>
    <div class="navbar navbar-inverse navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a href="/" class="navbar-brand">🚀 fast api audio</a>
            </div>
            <div class="navbar-collapse collapse">
                <ul class="nav navbar-nav">
                   <li><a href="/">Home</a></li>
                   <li><a href="/audio-studio">Text to Speech</a></li>
                   <li><a href="/audio-frequency">Frequency Board</a></li>
                   <li><a href="/word-editor">Word Editor</a></li>
                </ul>
            </div>
        </div>
    </div>
    <main class="container body-content">
        {% block content %}{% endblock %}
    </main>
    <hr />
    <footer class = "container">
        <p>&copy; {{ year }} - Fast API Application</p>
    </footer>
       
    {% block scripts %}
    <script src="/static/scripts/jquery-1.10.2.js"></script>
    <script src="/static/scripts/bootstrap.js"></script>
    <script src="/static/scripts/respond.js"></script>
    {% endblock %}
</body>
</html>
